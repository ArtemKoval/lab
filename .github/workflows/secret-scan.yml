name: secret-scan

on:
  workflow_dispatch:
    inputs:
      base:
        description: The base ref the diff runs against
        required: false
        default: main
        type: string
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the added lines for secrets
        env:
          # The operator literals travel through the repository secret of
          # the same name. A fork pull request sees no secret, so the scan
          # degrades to the built-in shapes there.
          SECRET_SCAN_LITERALS: ${{ secrets.SECRET_SCAN_LITERALS }}
        run: |
          base="${{ github.base_ref }}"
          if [ -z "$base" ]; then
            base="${{ inputs.base }}"
          fi
          python3 tools/sec_scan/sec_scan.py --root . --diff "origin/$base"
