name: build

on:
  workflow_dispatch:
  pull_request:
    paths: ['fde/**', '.github/workflows/build.yml']
  push:
    tags: ['v*']

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, triple: aarch64-apple-darwin }
          - { os: macos-15-intel, triple: x86_64-apple-darwin }
          - { os: windows-latest, triple: x86_64-pc-windows-msvc }
          - { os: ubuntu-24.04, triple: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    env:
      # electron-builder skips macOS signing on pull requests by default; the
      # ad-hoc signature is part of the shipped v1 contract, so force it.
      CSC_FOR_PULL_REQUEST: true
    defaults:
      run:
        working-directory: fde
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fde/package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Bundle the renderer
        run: npm run vendor
      - name: Fetch the pinned Python runtime
        run: npm run fetch-python
      - name: Install the runtime dependencies
        run: npm run install-pylibs
      - name: Pack the app (pull request build, macOS and Windows)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && matrix.os != 'ubuntu-24.04' }}
        run: npm run build:dir
      - name: Build the AppImage (pull request build, Linux)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-24.04' }}
        run: npm run build
      - name: Build the installers (tag build)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: npm run build
      - name: Confirm the ad-hoc macOS signature
        if: ${{ matrix.os == 'macos-15' || matrix.os == 'macos-15-intel' }}
        run: |
          for d in dist/mac-arm64 dist/mac; do
            if [ -d "$d/FDE Chat.app" ]; then
              codesign -dv "$d/FDE Chat.app" 2>&1 | grep -i "Signature=adhoc"
            fi
          done
      - name: Launch smoke test
        run: npm run smoke
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fde-${{ matrix.triple }}
          path: |
            fde/dist/*.dmg
            fde/dist/*.zip
            fde/dist/*.exe
            fde/dist/*.AppImage
          if-no-files-found: warn

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Check the tag against the app version
        run: |
          APP_VERSION="v$(node -p "require('./fde/package.json').version")"
          if [ "$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the app version $APP_VERSION"
            exit 2
          fi
      - name: Collect the installers
        run: |
          mkdir installers
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' \) \
            -exec cp {} installers/ \;
          ls -la installers
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "FDE Chat $GITHUB_REF_NAME" \
            --notes "Installers of FDE Chat $GITHUB_REF_NAME for macOS (arm64 and x64), Windows (x64), and Linux (x64). See fde/README.md for the per-OS first-run steps; the v1 builds are unsigned." \
            || gh release upload "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --clobber
