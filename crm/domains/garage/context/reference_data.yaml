  - topic: cities
    description: The cities the AutoFix network serves, and how far the other cities sit from each one.
    facts:
      - "The network serves London, Reading, Leeds, Manchester, and Birmingham."
      - "Reading sits about 40 miles from London; every other city sits over 150 miles from London."
      - "A garage outside the caller's city loses the location step, whatever its brand and specialism match say."
