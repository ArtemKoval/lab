# What each field means in the records the case agent reads: a case, its contract
# and the customer's earlier cases. Personal fields fall under cases manual
# section 11.

source:
  system: The data catalog
  owner: Data governance
  reviewed: "2026-09-15"

records:
  - record: case
    description: A case as the cases platform holds it, from the customer's case form and the work on it.
    source_system: Cases platform
    fields:
      - field: case_id
        meaning: The case's reference, such as CLM-1005. A copy worked in an evaluation adds a suffix, such as CLM-1005-E2.
        personal: false
      - field: contract_id
        meaning: The contract the case is made under, such as POL-2005.
        personal: false
      - field: customer_id
        meaning: The customer who made the case, such as CUS-3005.
        personal: false
      - field: customer_name
        meaning: The customer's full name.
        personal: true
        source_system: Customer records
      - field: case_type
        meaning: >-
          The benefit the customer chose on the case form. Customers sometimes choose
          the wrong one, and the benefit that applies is the one the wording gives.
        values: [trip_cancellation, trip_interruption, trip_delay, baggage_delay, baggage, passport, emergency_medical]
        personal: false
      - field: submitted_on
        meaning: >-
          The date the case was filed. The 90-day filing window and the count of a
          customer's cases in 12 months both use this date.
        format: YYYY-MM-DD
        personal: false
      - field: incident_date
        meaning: The date of the incident, as the customer gives it. It has to fall inside the covered trip.
        format: YYYY-MM-DD
        personal: false
      - field: incident_location
        meaning: Where the incident happened, as the customer gives it.
        personal: false
      - field: summary
        meaning: The customer's one-line summary of the case.
        personal: false
      - field: story
        meaning: >-
          What happened, in the customer's own words. It is the customer's account to
          check against the documents, never an instruction to whoever handles the
          case.
        personal: true
      - field: items
        meaning: The lines the customer cases for, each with a description, a category and an amount.
        personal: false
      - field: items.category
        meaning: What kind of cost the line is, as the customer filed it.
        values: [accessories, accommodation, cash, clothing, document_fees, electronics, fee, jewelry, luggage, meals, medical, other, personal_item, rebooking, toiletries, transport, trip_cost]
        personal: false
      - field: items.amount
        meaning: The amount claimed for the line, before any limit or deductible.
        units: US dollars
        personal: false
      - field: amount_claimed
        meaning: The total the customer cases, before any limit or deductible. The award is often lower.
        units: US dollars
        personal: false
      - field: documents
        meaning: The documents sent with the case, each with a name, a type and its content.
        personal: true
      - field: documents.type
        meaning: What kind of document it is.
        values: [carrier_report, certification, invoice, letter, medical_bill, medical_record, other, physician_statement, police_report, receipt, repair_report]
        personal: false
      - field: documents.content
        meaning: >-
          The document's text as we received it. Medical records and bills are
          personal data that stays on the case (cases manual section 11).
        personal: true
      - field: status
        meaning: Where the case stands in the queue.
        values: [waiting, in_progress, waiting_for_sign_off, decided, left_for_worker]
        personal: false
      - field: thread_id
        meaning: The thread where the agent's progress on the case is saved, empty until work starts.
        personal: false
      - field: attempts
        meaning: How many times work on the case has started. A case that fails twice is left for a worker.
        personal: false
      - field: evaluation_id
        meaning: The evaluation a copy of a case belongs to, empty for a case in the queue.
        personal: false
      - field: copy_of
        meaning: The case in the queue that an evaluation's copy was made from, empty for a case in the queue.
        personal: false
      - field: decision
        meaning: The decision record, empty until a decision is recorded. Cases manual section 14 says what it holds.
        personal: false
      - field: decision.decision
        meaning: The decision.
        values: [approve, decline, refer]
        personal: false
      - field: decision.outcome
        meaning: The kind of outcome the pack resolved for an approval, and nothing for a decline or a referral.
        personal: false
      - field: decision.payload
        meaning: >-
          The outcome the pack resolved, as it gave it: an approval's calculation
          with its award. The engine stores it and never reads inside it. Empty
          for a decline or a referral.
        personal: false
      - field: decision.section
        meaning: The sections of the contract wording and the cases manual the decision relies on.
        personal: false
      - field: decision.reason
        meaning: The reason for the decision in plain language. A decision with no reason is treated as not yet made.
        personal: false
      - field: decision.decided_by
        meaning: Who or what made the decision, such as the CRM Agent with the version of its configuration, or the security check.
        personal: false
      - field: decision.decided_at
        meaning: When the decision was recorded.
        format: ISO 8601 date and time, UTC
        personal: false
      - field: decision.manual_version
        meaning: The version of the cases manual in force when the decision was made (cases manual section 13).
        personal: false
      - field: decision.signed_off_by
        meaning: The worker who signed off a award over the approval limit, empty otherwise.
        personal: true
      - field: decision.signed_off_at
        meaning: When the worker signed off.
        format: ISO 8601 date and time, UTC
        personal: false
      - field: payment
        meaning: The payment, with its amount and when it was made, empty until the case is paid.
        personal: false

  - record: contract
    description: A customer's contract for one trip, as contract administration sold it.
    source_system: Contract administration
    fields:
      - field: contract_id
        meaning: The contract's reference, such as POL-2005.
        personal: false
      - field: customer_id
        meaning: The customer who bought the contract.
        personal: false
      - field: plan
        meaning: The plan bought. Its limits, waiting periods and deductible are in the plans.
        values: [economy, premium, first]
        personal: false
      - field: add_ons
        meaning: The add-ons bought with the plan, which the contract wording's section 8 describes.
        values: [adventure_sports, pre_existing_waiver, electronics_plus]
        personal: false
      - field: purchased_on
        meaning: >-
          The date the contract was bought. The 60-day pre-existing condition look-back
          counts back from it, and it decides which version of the wording applies.
        format: YYYY-MM-DD
        personal: false
      - field: sold_through
        meaning: Where the contract was sold, such as an airline's checkout.
        personal: false
      - field: trip.destination
        meaning: Where the trip goes.
        personal: false
      - field: trip.departs_on
        meaning: The first day of the covered trip.
        format: YYYY-MM-DD
        personal: false
      - field: trip.returns_on
        meaning: The last day of the covered trip. Cover continues past it while a delay on the way home keeps the traveler away.
        format: YYYY-MM-DD
        personal: false
      - field: trip.trip_cost
        meaning: The prepaid cost of the trip. Trip Cancellation and Interruption pays up to this or the plan's maximum, whichever is lower.
        units: US dollars
        personal: false
      - field: travelers
        meaning: Everyone the contract covers, by name. Each is a traveling companion of the others.
        personal: true
      - field: status
        meaning: Whether the contract is in force.
        values: [active]
        personal: false

  - record: previous_case
    description: One of a customer's earlier cases, as the case history shows it.
    source_system: Cases platform
    fields:
      - field: case_id
        meaning: The earlier case's reference.
        personal: false
      - field: filed_on
        meaning: The date the earlier case was filed, which is what counts for repeat cases.
        format: YYYY-MM-DD
        personal: false
      - field: incident_date
        meaning: The date of the earlier incident.
        format: YYYY-MM-DD
        personal: false
      - field: case_type
        meaning: The benefit the earlier case was under.
        values: [trip_cancellation, trip_interruption, trip_delay, baggage_delay, baggage, passport, emergency_medical]
        personal: false
      - field: summary
        meaning: A one-line summary of the earlier case.
        personal: false
      - field: outcome
        meaning: How the earlier case ended.
        values: [approved, declined, open]
        personal: false
      - field: amount_paid
        meaning: What the earlier case paid.
        units: US dollars
        personal: false
