# The rules cases operations applies to every case, with the numbers they use and
# the sections of the wording and the cases manual they come from.

source:
  system: Cases operations
  owner: Head of cases operations
  reviewed: "2026-09-01"

rules:
  - rule: filing_window
    name: Filing window
    days: 90
    applies: A case must be filed within 90 days of the incident.
    sections: [Contract wording 11, Cases manual 4]

  - rule: pre_existing_look_back
    name: Pre-existing condition look-back
    days: 60
    applies: >-
      Count back 60 days from the date the contract was bought. Symptoms, a physician
      visit, treatment or a change in medication for the same condition inside that
      window make it pre-existing. The Pre-Existing Condition Waiver removes the
      exclusion.
    sections: [Contract wording 7, Cases manual 7]

  - rule: repeat_cases
    name: Repeat cases
    cases: 3
    within_months: 12
    applies: >-
      A customer's third case within any 12 month period is referred to the Special
      Investigations Unit before payment, whatever its merits. Count cases by the
      date they were filed, and count every case, approved, declined or open. A
      first or second case in 12 months is decided in the normal way.
    sections: [Cases manual 9]

  - rule: meals_without_receipts
    name: Meals without receipts
    amount: 35.00
    per: traveler for each 24 hours of a covered Trip Delay, or part of 24 hours
    applies: >-
      Counted from the scheduled departure time, so a delay of 11 hours is one day and
      a delay of 30 hours is two. Meals only: accommodation, transport and rebooking
      fees always need receipts.
    sections: [Cases manual 10]
