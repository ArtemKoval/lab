[project]
name = "zai-routing-audit"
version = "1.0.0"
description = "Audit the z.ai GLM model routing behind Claude Code."
requires-python = ">=3.11"

# Mutation gate. Run mutmut on an out-of-tree copy of this directory,
# never inside the repository. See README.md, section "Mutation run".
[tool.mutmut]
source_paths = ["zai_routing_audit/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Run the whole suite for every mutant. The trampoline-hit mapping that
# picks a subset misses cross-module killers, and a missed kill is worse
# than a slower run.
pytest_add_cli_args = ["tests/"]
# mcp_server.py is a thin FastMCP wrapper with no logic of its own; the
# import and tool-call tests cover it. Its mutants only rename wrapper
# plumbing, so they are excluded from the score.
do_not_mutate_patterns = ["mcp_server.py"]
