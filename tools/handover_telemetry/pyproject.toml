[tool.mutmut]
# Mutation gate. Run mutmut on an out-of-tree copy of this directory,
# never inside the repository. See README.md, section "Mutation run".
source_paths = ["handover_telemetry/"]
pytest_add_cli_args_test_selection = ["tests/handover_telemetry/"]
pytest_add_cli_args = ["tests/handover_telemetry/"]
# __main__.py is a two-line shim with no logic of its own, mirroring the
# .coveragerc omit; its mutants only rename the raise.
do_not_mutate_patterns = ["__main__.py"]
