schema: intent-driven

# Project context
context: |
  Harness: Claude Code only. Skills live in .claude/skills/, agents in .claude/agents/.
  Prose follows ASD-STE100 (CLAUDE.md), except vendored upstream files.
  Discipline: the proposal PR merges to main before apply starts; the
  implementation PR merges before the archive PR. openspec-git-discipline
  owns the gates.

rules:
  proposal:
    - Must use grill-me skill
    - Must use adversarial-authoring skill
  specs:
    - Must use gherkin-authoring skill
    # - Must use spec-as-source skill
  design:
    - Must use c4-diagrams skill
    # - Must use glossary skill
  adr:
    - Must use architectural-decision-records skill
  tasks: [] # Must use spec-as-source skill once enabled

operations:
  apply:
    guidance:
      - Must use test-driven-development skill
  archive:
    guidance:
      - Must run OpenSpec Sync before archiving
