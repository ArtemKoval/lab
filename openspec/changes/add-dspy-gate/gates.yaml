# Change-level gates for add-dspy-gate. Thresholds are reviewed artifacts.
# Model pins: glm-5.3-flash on every role per the user directives of 2026-11-02
# and 2026-11-03. The guide pinned glm-5.3 and glm-4.5v; this change does not.
version: 1

models:
  provider: zai
  base_url: https://api.z.ai/api/paas/v4/
  key_var: ZAI_API_KEY
  roles:
    runtime:      { model: glm-5.3-flash, temperature: 0.2, thinking: disabled, max_tokens: 8192 }
    runtime_hard: { model: glm-5.3-flash, temperature: 0.6, thinking: disabled, max_tokens: 8192 }
    reflection:   { model: glm-5.3-flash, temperature: 0.6, thinking: disabled, max_tokens: 16384 }
    judge:        { model: glm-5.3-flash, temperature: 0.0, thinking: disabled, max_tokens: 4096 }
    vision_judge: { model: glm-5.3-flash,      temperature: 0.0, thinking: disabled, max_tokens: 4096 }

policy_bounds:
  tier_b_min: { min: 0.60, max: 1.00 }
  holdout_ratio: { min: 0.10, max: 0.50 }
  judge_ensemble: { min: 1, max: 5 }

capabilities:
  ticket-triage:
    gate_2: { tier_a: 1.00, tier_b_min: 0.80, flake_budget: 2, max_optimize_loops: 3 }
    gate_5: { judge_ensemble: 3, drift_window_days: 7, alert_below: 0.80 }
    budget: { p95_tokens_per_scenario: 2500, p95_latency_s: 20 }
    holdout_ratio: 0.3

suites:
  frozen: openspec/specs/**/evals/
  delta: openspec/changes/*/evals/

ci:
  tier_a_on_push: true
  e2e_gate_var: DSPY_GATE_E2E
  nightly_var: DSPY_NIGHTLY_ENABLED
  quarantine_expiry_days: 14
