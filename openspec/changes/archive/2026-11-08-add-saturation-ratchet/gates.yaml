# Change-level gates for add-saturation-ratchet. Thresholds are reviewed
# artifacts. This change declares no governed capability: the harness
# registry holds only ticket-triage, so the dspy gates stay out of scope
# and this file carries the policy reference only. This change's own new
# code meets the local mutation rule with no survivors. The CI
# resolution for changed paths stays as it is. A separate change raises
# that resolution to the saturation bar.
version: 1

models:
  provider: zai
  base_url: https://api.z.ai/api/paas/v4/
  key_var: ZAI_API_KEY

policy_bounds:
  tier_b_min: { min: 0.60, max: 1.00 }
  holdout_ratio: { min: 0.10, max: 0.50 }
  judge_ensemble: { min: 1, max: 5 }

capabilities: {}

suites:
  frozen: openspec/specs/**/evals/
  delta: openspec/changes/*/evals/

ci:
  tier_a_on_push: true
  e2e_gate_var: DSPY_GATE_E2E
  nightly_var: DSPY_NIGHTLY_ENABLED
  quarantine_expiry_days: 14
