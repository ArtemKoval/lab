[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e: opt-in live API tests; skipped unless FDE_E2E_KEY is set"]
addopts = "--cov=backend --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
# backend/__main__.py executes only inside the spawned interpreter of
# test_real_interpreter_serves_ready_line_shutdown_and_exit, where the in-process
# tracer cannot see it. That test proves the module runs end to end.
omit = ["backend/__main__.py"]

[tool.mutmut]
paths_to_mutate = ["backend/"]
tests_dir = ["tests/"]
